# Per-dataset configuration for region-connectivity OWL generation.
# Each top-level key is a dataset: the <dataset> build arg and the output-file
# suffix (region_connectivity_<key>.owl). Read by both
# src/scripts/make_region_connectivity.py and the Makefile (DATASETS list).
#
#   site        : VFB Site node short_form (the connectome data source).
#   roi_dataset : VFB DataSet short_form whose members are the region individuals
#                 (painted domains).
#   endpoint    : "kb" (default) or "pdb" — where to query VFB. kb is the source
#                 graph (holds datasets before they reach pdb).
#   source      : "neuprint" (default) — pull counts from neuprint-python; or
#                 "flywire" — read counts from a flywire codex CSV (csv_url).
#   csv_url     : (source: flywire) URL/path of the neuropil_synapse_table CSV.

hemibrain:
  site: neuprint_JRC_Hemibrain_1point2point1
  roi_dataset: Xu2020roi

male-cns:
  site: male-cns_v1_0
  roi_dataset: Berg2025aroi

# manc: two Site versions share the same neuron individuals (bodyIds stable); we
# use the latest, v1.2.1.
manc:
  site: neuprint_JRC_Manc_1_2_1
  roi_dataset: Takemura2023roi

# optic-lobe: the LOP/ME/LO column sub-ROIs have no individual and are dropped
# (their synapses are counted at the parent neuropil), like male-cns.
optic-lobe:
  site: neuprint_JRC_OpticLobe_v1_0_1
  roi_dataset: Nern2024roi

# flywire (FAFB): not in neuprint. Counts come from the codex per-neuron neuropil
# synapse table (input/output synapses per region); no T-bars, so the presynaptic
# edge carries `downstream`. Release 783 (matches the flywire783 Site).
flywire:
  site: flywire783
  roi_dataset: Dorkenwald2023roi
  source: flywire
  csv_url: https://storage.googleapis.com/flywire-data/codex/data/fafb/783/neuropil_synapse_table.csv.gz
