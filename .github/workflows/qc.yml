name: QC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Unit tests + offline pipeline tests: run the real transform on SAVED
  # neuprint/kb samples (src/scripts/test_data/) for hemibrain and male-cns,
  # ROBOT-convert, and run the SPARQL shape checks. No live queries. Full-file
  # verify is intentionally not run in CI — it doesn't fit in a runner's memory
  # at connectome scale, and the sample checks + build-time construction cover
  # validation.
  tests:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:latest
    env:
      ROBOT_JAVA_ARGS: -Xmx4G
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install --break-system-packages -r src/scripts/requirements.txt pytest
      - name: Run tests
        run: cd src/scripts && python3 -m pytest -q
