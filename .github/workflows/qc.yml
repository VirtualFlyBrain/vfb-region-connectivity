name: QC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Unit tests + offline pipeline tests: run the real transform on SAVED
  # neuprint/kb samples (src/scripts/test_data/) and stubbed flywire/banc/
  # catmaid sources, ROBOT-convert, and run the SPARQL shape checks. No live
  # queries. The committed artifacts are not rebuilt or verified here — that
  # needs the live sources and doesn't fit in a runner's memory; each build
  # shape-checks a sample of its own output instead.
  tests:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:latest
    env:
      ROBOT_JAVA_ARGS: -Xmx4G
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install --break-system-packages -r src/scripts/requirements.txt pytest
      - name: Run tests
        run: cd src/scripts && python3 -m pytest -q
